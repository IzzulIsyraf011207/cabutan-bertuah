# Ping Supabase setiap 3 hari supaya projek plan percuma tidak dihentikan
# (Supabase menghentikan projek percuma selepas 7 hari tiada aktiviti).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1 */3 * *"   # 01:17 UTC (09:17 waktu Malaysia), setiap 3 hari
  workflow_dispatch:          # boleh dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database Supabase
        env:
          SUPABASE_URL: https://scxpyfvdhcjalsedasel.supabase.co
          # Kunci publishable (sama seperti dalam assets/config.js, selamat untuk awam)
          SUPABASE_KEY: sb_publishable_dOMhL_JnSurmr3nDrvfG9Q_Pgelo6yf
        run: |
          code=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/senarai_roda?limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            cat response.json
            echo "::error::Supabase tidak menjawab (HTTP $code). Projek mungkin sudah dihentikan: buka dashboard Supabase dan tekan Restore project."
            exit 1
          fi
